-- Catalog entries for the LewisHost.Net oc-programs programs.cfg (oppm
-- format), for a copy of this repository at oc-programs/muxos/. Merge
-- these two entries into the catalog's top-level table; if the copy lives
-- elsewhere, change the "muxos/" part of each file path.
--
--   muxos-installer  the muxos installer, for an OpenOS computer:
--                    opm pull muxos-installer <floppy>  then
--                    /mnt/<floppy>/muxos kernal  (or  ... worker)
--   opm-mxe          opm for muxos; muxos's own `opm update` pulls it
{
  ["muxos-installer"] = {
    files = {
      ["master/muxos/dist/muxos-installer.lua"] = "/bin",
    },
    name = "muxos-installer",
    description = "muxos installer: kernal disk and worker EEPROMs",
    launcher = "muxos",
  },
  ["opm-mxe"] = {
    files = {
      ["master/muxos/opm/opm.mxe"] = "/bin",
      ["master/muxos/opm/opm_core.lua"] = "/lib/mxe",
    },
    name = "opm-mxe",
    description = "opm for muxos",
  },
}
