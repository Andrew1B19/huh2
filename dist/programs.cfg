-- Catalog entries for the LewisHost.Net oc-programs programs.cfg (oppm
-- format), for a copy of this repository at oc-programs/munix/. Merge
-- these two entries into the catalog's top-level table; if the copy lives
-- elsewhere, change the "munix/" part of each file path.
--
--   munix-installer  the munix installer, at the root of a floppy:
--                    opm pull munix-installer <floppy>
--                    Boot any computer from it (the floppy's /init.lua
--                    starts the installer; no OpenOS needed), or on
--                    OpenOS run /mnt/<floppy>/munix-installer.lua.
--                    Only ever pull it to a floppy: it has an /init.lua.
--   opm-mxe          opm for munix; munix's own `opm update` pulls it
--   munix-demo       the munix demo (threads, child processes on the
--                    workers, color and braille graphics): on munix,
--                    opm pull munix-demo  (-> /usr/bin/demo.mxe); or
--                    pull it to a floppy and, in munix,
--                    cp /mnt/<floppy>/bin/demo.mxe /usr/bin/
--   muxterm          a network terminal for munix, for OpenOS computers on
--                    the munix cluster's network: oppm install muxterm,
--                    then `muxterm` logs in to munix from there
{
  ["munix-installer"] = {
    files = {
      ["master/munix/dist/munix-installer.lua"] = "/",
      ["master/munix/dist/munix-installer.dat"] = "/",
      ["master/munix/dist/floppy/init.lua"] = "/",
    },
    name = "munix-installer",
    description = "munix installer: kernal disk and worker EEPROMs",
  },
  ["munix-demo"] = {
    files = {
      ["master/munix/apps/demo.mxe"] = "/bin",
    },
    name = "munix-demo",
    description = "munix demo: threads, child processes, color and braille graphics",
  },
  ["muxterm"] = {
    files = {
      ["master/munix/apps/muxterm.lua"] = "/bin",
    },
    name = "muxterm",
    description = "muxterm: log in to munix over the network from OpenOS",
  },
  ["opm-mxe"] = {
    files = {
      ["master/munix/opm/opm.mxe"] = "/bin",
      ["master/munix/opm/opm_core.lua"] = "/lib/mxe",
    },
    name = "opm-mxe",
    description = "opm for munix",
  },
}
